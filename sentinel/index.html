return ok?`<div class="bx vd">${C}<div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(x.m)} · ${x.d==="NONE"?"rien":x.d}</b><span class="m n">${x.dt!=null?"T0 + "+fx(x.dt,1)+" s":""}</span></div><div>${esc(x.j)}</div>${x.cite?`<div class="m" style="font-size:12px">Cite : ${esc(x.cite)}</div>`:""}</div>`
:`<div class="bx vd abs">${C}<div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(x.m)} · —</b><span>${esc(x.j||"pas de réponse")}</span></div></div>`}).join("");
else h+=`<div class="m" style="font-size:13.5px">${O.dx?'Chargement…<span class="ld"></span>':"Aucun verdict joint à cette offre."}</div>`;
const a=accord(),tr=O.reco==="CALL"||O.reco==="PUT";
h+=`<div class="lab">Conclusion du code</div><div style="font-size:13.5px"><b>${a===null?"":a?"Accord → ":"Désaccord → "}${tr?O.reco:"aucune direction"}.</b> ${esc((DET&&DET.regle)||O.regle||"")}</div>`;
return h;
}
function vReg(){
const L=O.lim;
if(!L)return`<p class="m" style="font-size:13.5px">Cette offre n'accepte pas encore de réglages : le serveur appliquera les paramètres ci-dessous.</p><div class="kv n"><span class="m">Capital</span><span>${e0(DEF.cap)}</span><span class="m">Ask max</span><span>+${DEF.tol} %</span><span class="m">Sortie</span><span>${DEF.tmax} min</span></div><div class="lks"><button data-v="cot">Cotation ›</button><button data-v="lia">Liaison ›</button><button data-v="his">Historique ›</button></div>`;
const sz=[.25,.5,1].concat(L.cap_max>=DEF.cap*2?[2]:[]),dirs=["PUT","CALL"].filter(d=>O.j[d]&&O.j[d].ok&&O.tok[d]);
const tols=[0,.5,1,2].filter(t=>t<=(L.tol_max??5));
return`<div class="st" id="vieil" style="margin:12px 0 0;font-size:13px"></div><div class="bx grp">${C}<div class="lab">Taille</div><div class="seg" id="sz">${sz.map(f=>`<button data-f="${f}" class="n${f>1?" up":""}">${({.25:"¼",.5:"½",1:"1×",2:"2×"})[f]}</button>`).join("")}</div>
<div class="lab">Capital engagé <span class="n">${i0(L.cap_min??0)} – ${i0(L.cap_max)} €</span></div>
<label class="in"><input id="cap" type="number" inputmode="numeric" min="${L.cap_min??0}" max="${L.cap_max}" step="1" aria-label="Capital engagé"><span>€</span></label>
<input id="capr" type="range" min="${L.cap_min??0}" max="${L.cap_max}" step="5" aria-label="Capital">
<div class="lab">Unités <span class="n">max ${i0(L.qty_max)} · recalcul croisé</span></div>
<div class="g2">${dirs.map(d=>`<label class="in"><input id="q${d}" type="number" inputmode="numeric" min="1" max="${L.qty_max}" step="1" aria-label="Unités ${d}"><span>u ${d}</span></label>`).join("")}</div>
<div class="tot n" id="cout"></div></div>
<div class="bx grp">${C}<div class="lab">Ask maximal accepté</div><div class="seg" id="tol">${tols.map(t=>`<button data-t="${t}">${t?"+"+fx(t,t%1?1:0)+" %":"affiché"}</button>`).join("")}</div>
<div class="ab n" id="amx" style="font-size:12px;margin-top:6px"></div>
<div class="lab">Sortie au temps (simulée)</div><div class="seg" id="tm">${[1,5,15].map(t=>`<button data-m="${t}">${t} min</button>`).join("")}</div></div>
<div class="lab" style="margin-top:18px">Ces réglages valent pour</div><div class="seg" id="mem"><button data-p="0">Cette offre</button><button data-p="1">Toutes (ce navigateur)</button></div>
<div class="lks"><button data-v="cot">Cotation ›</button><button data-v="lia">Liaison ›</button><button data-v="his">Historique ›</button></div>`;
}
function lierReg(){
if(!O.lim)return;const L=O.lim;
const maj=src=>{const c=$("cap");if(src!=="cap")c.value=P.cap;if(src!=="capr")$("capr").value=P.cap;
["PUT","CALL"].forEach(d=>{const q=$("q"+d);if(q&&src!=="q"+d)q.value=qty(d)});
const ds=["PUT","CALL"].filter(d=>$("q"+d));$("cout").classList.toggle("up",P.cap>DEF.cap);$("cout").innerHTML=`<span>Coût à l'ask<br>${ds.map(d=>`${d} ${fx(qty(d)*O.j[d].ask,2)} €`).join(" · ")}</span><span style="text-align:right">Perte max${P.cap>DEF.cap?" · au-dessus du défaut":""}<br><b>${e0(Math.max(...ds.map(d=>qty(d)*O.j[d].ask)))}</b></span>`;
$("amx").textContent="Au-delà, refus : "+["PUT","CALL"].filter(d=>$("q"+d)).map(d=>`${d} ≤ ${fx(am(d)/1000)} €`).join(" · ");
document.querySelectorAll("#sz button").forEach(b=>b.classList.toggle("on",Math.round(DEF.cap*b.dataset.f)===P.cap));$("capr").style.accentColor=P.cap>DEF.cap?"var(--ab)":"";
document.querySelectorAll("#tol button").forEach(b=>b.classList.toggle("on",+b.dataset.t===P.tol));
document.querySelectorAll("#tm button").forEach(b=>b.classList.toggle("on",+b.dataset.m===P.tmax));
document.querySelectorAll("#mem button").forEach(b=>b.classList.toggle("on",!!+b.dataset.p===P.mem));
majBtns()};
const setCap=(v,src)=>{P.cap=clamp(Math.round(v)||L.cap_min||1,L.cap_min,L.cap_max);P.qd=null;maj(src)};
document.querySelectorAll("#sz button").forEach(b=>b.onclick=()=>setCap(DEF.cap*b.dataset.f));
$("cap").oninput=e=>{const v=+e.target.value;if(v)setCap(v,"cap")};$("cap").onchange=()=>maj();
$("capr").oninput=e=>setCap(+e.target.value,"capr");
["PUT","CALL"].forEach(d=>{const q=$("q"+d);if(!q)return;q.oninput=e=>{let v=Math.floor(+e.target.value);if(!v)return;
v=clamp(v,1,L.qty_max);const cap=Math.ceil(v*O.j[d].ask);if(cap>L.cap_max){v=Math.floor(L.cap_max/O.j[d].ask)}
P.qd={d,q:v};P.cap=clamp(Math.ceil(v*O.j[d].ask),L.cap_min,L.cap_max);maj("q"+d)};q.onchange=()=>maj()});
document.querySelectorAll("#tol button").forEach(b=>b.onclick=()=>{P.tol=+b.dataset.t;maj()});
document.querySelectorAll("#tm button").forEach(b=>b.onclick=()=>{P.tmax=+b.dataset.m;maj()});
document.querySelectorAll("#mem button").forEach(b=>b.onclick=()=>{P.mem=!!+b.dataset.p;maj()});
maj();
}
function vCot(){return`<div class="kv n" style="margin-top:12px">${["CALL","PUT"].filter(d=>O.j[d]).map(d=>{const j=O.j[d];return j.ok?`<span class="m">${d}</span><span>bid ${fx(j.bid)} · ask ${fx(j.ask)} · spread ${fx((j.ask-j.bid)/j.ask*100,2)} %</span>`:`<span class="m">${d}</span><span>indisponible : ${esc(j.motif)}</span>`}).join("")}
<span class="m">Âge</span><span>${Math.floor(ageS())} s (cotes ${hmUTC(O.qt)})</span><span class="m">Expiration</span><span>${hmUTC(O.exp)}</span><span class="m">Offre</span><span>${esc(O.o)} v${O.v}</span>${O.prod?`<span class="m">Produit</span><span>${esc(O.prod)}</span>`:""}</div>`}
function vLia(){const l=lire("sentinel_lat"),pr=lire("sentinel_pref");
return`<div class="kv n" style="margin-top:12px"><span class="m">Appareil</span><span>${APP.t?"appairé depuis le "+new Date(APP.t).toLocaleString("fr-FR",{timeZone:"Europe/Paris"}):"appairé"}</span><span class="m">Relais</span><span>${esc(O.base)}</span>
<span class="m">Dernier envoi</span><span>${l?fx(l.ms/1000,2)+" s ("+hm(l.t)+")":"—"}</span><span class="m">Préférences</span><span>${pr?`${fx(pr.f,2)}× · +${pr.tol} % · ${pr.tmax} min`:"aucune (défauts de l'offre)"}</span><span class="m">Test</span><span id="tsr">—</span></div>
<button class="ign" id="tst" style="margin-top:16px">Tester la connexion</button>${pr?`<button class="ign" style="margin-top:10px;color:var(--atx)" onclick="localStorage.removeItem('sentinel_pref');feuille('lia')">Oublier les préférences de ce navigateur</button>`:""}`}
async function tester(){const r=$("tsr");r.textContent="…";const t=performance.now();
try{await lireTopic(O.base,O.ack,"1s");r.textContent=`relais joignable · ${fx((performance.now()-t)/1000,2)} s aller-retour`}catch(e){r.textContent="injoignable ("+e.message+")"}}
function vHis(){const h=(lire("sentinel_hist")||[]).slice(0,5);
return h.length?`<p class="m" style="font-size:12.5px">P&amp;L simulé au dernier point marqué · bilan sur Telegram</p>`+h.map(x=>`<div class="ln n"><span>${new Date(x.tc).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"})} · ${esc(x.e)} · <b>${esc(x.a==="SKIP"?"Ignoré":x.a)}</b>${x.q?" "+i0(x.q)+" u":""}</span><span>${x.pnl!=null?`<b>${sg(x.pnl)} €</b>`:'<span class="m">—</span>'}</span></div>`).join(""):`<p class="m">Aucune décision enregistrée dans ce navigateur.</p>`}
let CA=null,OUV=null,CH={},PT={},PA=null;
const paris=ms=>new Date(ms).toLocaleTimeString("fr-FR",{timeZone:"Europe/Paris",hour:"2-digit",minute:"2-digit"});
const hm5=ms=>hm(ms).slice(0,5),verrou=e=>e.lock||Date.now()>=e.arm;
const cdesc=c=>c?`${esc(c.emet)} ×${fx(c.lev,1)}`:"—",trouve=(e,d,id)=>(e.cand[d]||[]).find(c=>c.id===id);
async function carnet(p){
APP=lire("sentinel_appareil");if(!APP||!APP.k){coller(p);return}
K=b64uDec(APP.k);
try{CA=await ouvrirScelle(K,p.get("c"))}catch(e){erreur(e.message);return}
const mem=lire("sentinel_prep_"+CA.c)||{},D=CA.def||{cap:200,tol:1,tmax:5};
for(const e of CA.ev){const s=e.sel||{},m=mem[e.id]&&mem[e.id].v===e.v?mem[e.id]:{},d=e.def||D;
CH[e.id]={CALL:m.CALL||s.CALL||"auto",PUT:m.PUT||s.PUT||"auto",cap:m.cap??d.cap,tol:m.tol??d.tol,tmax:m.tmax??d.tmax,ok:m.ok||!!e.sel}}
OUV=(CA.ev.find(e=>e.inv&&!verrou(e))||{}).id||null;
PA=CA.ev.map(verrou).join();rPrep();ecouterPrep();
setInterval(()=>{const l=CA.ev.map(verrou).join();if(l!==PA){PA=l;rPrep()}},2000);
}
function hP(ms){const [h,m]=paris(ms).split(":").map(Number);return(h+m/60)/24*100}
function rPrep(){
const now=hP(Date.now()),d0=CA.ev.length?new Date(CA.ev[0].t0).toDateString():"";
$app.innerHTML=`<div class="hd" id="hd"><div><div class="k">Préparation · carnet v${CA.v}</div><div class="ev">${esc(CA.titre||"Carnet du jour")}</div><div class="hs">Réglages à froid · verrou 1 min avant chaque T0</div></div><div><div class="num sm n">${CA.ev.length}<small> év.</small></div></div></div>
<div class="bd"><div class="tl0"><div class="tlb">${CA.ev.map((e,i)=>`<i class="tlm${e.ferme?" f":""}${verrou(e)?" l":""}" style="left:${hP(e.t0).toFixed(1)}%">${i+1}</i>`).join("")}${new Date().toDateString()===d0?`<i class="tln" style="left:${now.toFixed(1)}%"></i>`:""}</div>
<div class="n" style="position:relative;height:15px;margin-top:4px;font-size:11px;color:var(--mut);white-space:nowrap"><span style="position:absolute;left:0">0 h</span><span style="position:absolute;left:33.33%;transform:translateX(-50%)">8 h</span><span style="position:absolute;left:62.5%;transform:translateX(-50%)">séance des turbos</span><span style="position:absolute;left:91.67%;transform:translateX(-50%)">22 h</span></div></div>
<p class="m" style="font-size:13px;margin:0 0 14px">Choisis ton turbo préféré dans chaque sens. Sans choix, le moteur choisit et l'offre le dira.</p>
${CA.ev.map(cartePrep).join("")}<p class="foot">Carnet ${esc(CA.c.slice(0,8))} v${CA.v}. Le serveur revérifie tes choix à la préalerte (15 min avant).</p></div>`;
$app.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>actPrep(b.dataset));
}
function statutPrep(e){
const ch=CH[e.id],L=[];
if(e.ferme)L.push(`<span class="dbt">▲ fermé à T0 · offre à l'ouverture${e.ouv?" "+paris(e.ouv):""}</span>`);
for(const d of["CALL","PUT"])if(e.inv&&e.inv[d]&&ch[d]===e.inv[d].old)L.push(`<span class="dbt">▲ ${d} plus valable</span>`);
for(const d of["CALL","PUT"]){const a=ch[d]==="auto";L.push(`<span class="chp${a?"":" on"}">${AR[d]} ${d} · ${a?"moteur":cdesc(trouve(e,d,ch[d]))}</span>`)}
L.push(`<span class="m" id="pt${e.id}" style="margin-left:auto">${verrou(e)?"verrouillé "+hm5(e.arm):PT[e.id]||(ch.ok?"enregistré ✓":"non enregistré")}</span>`);
return L.join("");
}
function cartePrep(e,i){
const o=OUV===e.id,lk=verrou(e),imp=[1,2,3].map(k=>`<i class="${k<=(e.imp||1)?"":"o"}" style="height:${4+k*3}px"></i>`).join("");
return`<div class="bx pe${lk?" lock":""}${e.ferme?" f":""}">${C}<button class="peh" data-e="${e.id}" data-x="tog"><span class="pq"><span class="pqh n">${paris(e.t0)}</span><span class="pqs n">Paris</span></span>
<span class="pm"><span class="pt"><span class="pk">${i+1} · ${e.k==="res"?"Résultats":"Macro"}</span><span class="imp" aria-label="importance ${e.imp||1} sur 3">${imp}</span></span><span class="pn">${esc(e.e)}</span><span class="sjl"><span class="sjk">Sous-jacent</span><b>${esc(e.sj)}</b></span><span class="m n" style="font-size:12px;display:block;margin-top:4px">${e.cons?"Consensus "+esc(e.cons):""}${e.prev?" · précédent "+esc(e.prev):""}</span><span class="lk" style="display:block;margin-top:2px">${o?"Replier ▴":lk?"Voir ▾":"Choisir ▾"}</span></span></button>
<div class="ps">${statutPrep(e)}</div>${o?detPrep(e):""}</div>`;
}
function candRow(e,d,c,ch,dead){const mh=c.mh,r=mh!=null&&mh<1;
return`<button class="cand${ch[d]===c.id?" on":""}${dead?" dead":""}"${dead?" disabled":""} data-e="${e.id}" data-x="sel" data-d="${d}" data-c="${c.id}"><span class="cl n"><b>×${fx(c.lev,1)}</b><small>levier</small></span>
<span class="cm"><span class="ce">${esc(c.emet)}</span><span class="cg n"><span>barrière<b>${c.bar!=null?fx(c.bar,c.bar>=1000?0:2)+" · ":""}${fx(c.dist,1)} %</b></span><span>spread<b>${fx(c.spr,1)} %</b></span><span>ask<b>${fx(c.ask)} €</b></span></span>
${mh!=null?`<span class="cb${r?" r":""}"><i style="width:${Math.min(100,mh/3*100).toFixed(0)}%"></i></span>`:""}<span class="m n" style="font-size:11.5px">${mh!=null?fx(mh,1)+" mvt hab. jusqu'à la barrière · ":""}${i0(Math.floor(ch.cap/c.ask))} u pour ${i0(ch.cap)} €</span></span><span class="ck">✓</span></button>`}
function detPrep(e){
const ch=CH[e.id],D=CA.def||{cap:200},L=CA.lim||{};
let h=`<div class="pd">`;
if(e.ferme)h+=`<div class="st x" style="margin:12px 0 0;font-size:13px">Publication hors séance des turbos (avant 8 h ou après 22 h, Paris). L'offre portera sur l'ouverture${e.ouv?" de "+paris(e.ouv)+" Paris":" suivante"} ; aucun achat simulé à T0.</div>`;
for(const d of["CALL","PUT"]){
const iv=e.inv&&e.inv[d],mo=trouve(e,d,(e.moteur||{})[d]);
h+=`<div class="sens"><b class="arr" style="font-size:22px">${AR[d]}</b>${d} préféré<span>levier ${L.lev_min??5}–${L.lev_max??10} · barre : mvt hab.</span></div>`;
if(iv&&ch[d]===iv.old){const r=trouve(e,d,iv.rempl);
h+=`<div class="st x" style="margin:0 0 8px;font-size:13px"><b>Ton ${d} n'est plus valable</b> : ${esc(iv.motif)}.<br>Remplaçant proposé : ${cdesc(r)}${r?` · barrière à ${fx(r.dist,1)} %`:""}.</div><button class="bx bp pri" style="min-height:52px;margin-bottom:4px" data-e="${e.id}" data-x="rem" data-d="${d}">${C}<span class="dir" style="font-size:20px">Accepter le remplaçant</span><span class="arr" style="font-size:22px">✓</span></button>`}
h+=(e.cand[d]||[]).map(c=>candRow(e,d,c,ch,iv&&iv.old===c.id)).join("");
h+=`<button class="cand${ch[d]==="auto"?" on":""}" data-e="${e.id}" data-x="sel" data-d="${d}" data-c="auto"><span class="cl"><b>auto</b><small>moteur</small></span><span class="cm"><span class="ce">Laisser le choix du moteur</span><span class="m" style="font-size:12.5px">aujourd'hui : ${cdesc(mo)}</span></span><span class="ck">✓</span></button>`;
}
const sz=[.5,1,2].filter(f=>D.cap*f<=(L.cap_max??1e9)),tl=[0,.5,1,2].filter(t=>t<=(L.tol_max??5));
h+=`<div class="bx grp">${C}<div class="lab">Réglages par défaut de l'offre</div><div class="seg">${sz.map(f=>`<button class="n${f>1?" up":""}${ch.cap===Math.round(D.cap*f)?" on":""}" data-e="${e.id}" data-x="cap" data-c="${Math.round(D.cap*f)}">${i0(D.cap*f)} €</button>`).join("")}</div>
<div class="seg" style="margin-top:6px">${tl.map(t=>`<button class="${ch.tol===t?"on":""}" data-e="${e.id}" data-x="tol" data-c="${t}">${t?"ask +"+fx(t,t%1?1:0)+" %":"ask affiché"}</button>`).join("")}</div>
<div class="seg" style="margin-top:6px">${[1,5,15].map(t=>`<button class="${ch.tmax===t?"on":""}" data-e="${e.id}" data-x="tm" data-c="${t}">sortie ${t} min</button>`).join("")}</div>
<p class="ab" style="font-size:12px;margin:8px 0 0">Sur un événement qui bouge, le prix vieillit vite : un ask max serré se dépasse en quelques secondes.</p></div></div>`;
return h;
}
function actPrep(ds){
const e=CA.ev.find(x=>x.id===ds.e);if(!e)return;
if(ds.x==="tog"){OUV=OUV===e.id?null:e.id;rPrep();return}
if(verrou(e))return;
const ch=CH[e.id];
if(ds.x==="sel")ch[ds.d]=ds.c;else if(ds.x==="rem")ch[ds.d]=e.inv[ds.d].rempl;
else if(ds.x==="cap")ch.cap=+ds.c;else if(ds.x==="tol")ch.tol=+ds.c;else if(ds.x==="tm")ch.tmax=+ds.c;
ch.ok=false;PT[e.id]="envoi…";rPrep();
clearTimeout(ch.t);ch.t=setTimeout(()=>envPrep(e),700);
}
async function envPrep(e){
const ch=CH[e.id],tc=Date.now(),tol=Math.round(ch.tol*100);
const co={c:CA.c,v:CA.v,a:"PREP",e:e.id,ev:e.v,call:ch.CALL,put:ch.PUT,cap:ch.cap,tol,tmax:ch.tmax,k:"page",sim:true,tc};
co.s=await signer(K,"prep",CA.c,CA.v,e.id,e.v,co.call,co.put,co.cap,tol,co.tmax,tc);
try{await poster(CA.base,CA.r,co);PT[e.id]=`envoyé ${hm5(tc)} · attente de l'accusé`;
const m=lire("sentinel_prep_"+CA.c)||{};m[e.id]={v:e.v,CALL:ch.CALL,PUT:ch.PUT,cap:ch.cap,tol:ch.tol,tmax:ch.tmax};ecrire("sentinel_prep_"+CA.c,m)}
catch(x){PT[e.id]="envoi impossible — réessaie"}
const s=$("pt"+e.id);if(s)s.textContent=PT[e.id];
}
function ecouterPrep(){
const vus=new Set(),dep=Math.floor(Date.now()/1000)-60;
setInterval(async()=>{try{for(const m of await lireTopic(CA.base,CA.ack,dep)){if(vus.has(m.id))continue;vus.add(m.id);
let x;try{x=JSON.parse(m.message)}catch(e){continue}if(x.c!==CA.c||!CH[x.e])continue;
if(x.status==="prep_ok"){CH[x.e].ok=true;PT[x.e]=`enregistré ✓ ${m.time?hm5(m.time*1000):""}`;vib(VIB.ok);
const mm=lire("sentinel_prep_"+CA.c)||{};if(mm[x.e]){mm[x.e].ok=true;ecrire("sentinel_prep_"+CA.c,mm)}}
else if(x.status==="prep_rejected"){PT[x.e]=`refusé : ${x.reason||"motif inconnu"}`;vib(VIB.ko)}
else if(x.status==="prep_locked"){PT[x.e]="refusé : verrouillé, choix arrivé trop tard";vib(VIB.ko)}
else continue;
const s=$("pt"+x.e);if(s)s.textContent=PT[x.e]}}catch(e){}},2000);
}
(async()=>{
if(!window.crypto||!crypto.subtle){erreur("Navigateur sans WebCrypto (il faut HTTPS et un navigateur récent).");return}
const p=frag();
if(p.get("p"))return appairer(p);
if(p.get("o"))return offre(p);
if(p.get("c"))return carnet(p);
const app=lire("sentinel_appareil");
if(!app)return coller(null);
ecran("Sentinel","Téléphone appairé ✓",`<p class="m" style="margin:0">Les offres s'ouvrent depuis la notification ntfy.</p>`);
})();
